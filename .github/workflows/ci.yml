name: gyaan-saathi-ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gyaan_saathi_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d gyaan_saathi_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gyaan_saathi_ci
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run migrate
      - run: npm run verify-schema
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run reconcile-sync
  security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm audit --audit-level=high
      - run: node scripts/contract-check.mjs
