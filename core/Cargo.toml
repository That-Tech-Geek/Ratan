[package]
name = "attune-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Privacy-first safety, state, memory, policy, generation and evaluation runtime"

[lib]
name = "attune_core"
path = "src/lib.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
aes-gcm = "0.10"
zeroize = "1"
