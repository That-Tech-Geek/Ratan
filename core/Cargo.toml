[package]
name = "attune-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic safety, belief state, bounded policy, and template runtime for Attune"

[lib]
name = "attune_core"
path = "src/lib.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
